[project]
name = "datex2-adapter"
version = "0.1.0"
description = "Pluggable adapter that transforms road weather forecasts into DATEX II v3.4"
authors = [{ name = "Harshal Kothari", email = "founder@curriculo.me" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "requests>=2.31",
    "xsdata[cli,lxml]>=24.1",
    "xmlschema>=3.0",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # multi-source fusion + road-segment map dashboard
    "pandas>=2.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pytz>=2024.1",        # duckdb materializes tz-aware event_timestamps (build_sensors.py)
    "shapely>=2.0",
    "pyproj>=3.6",
    "folium>=0.16",
    # road-condition prediction (forecast path)
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "httpx>=0.26",
    "ruff>=0.3",
    "playwright>=1.40",   # optional: dashboard screenshots
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapter*", "sources*", "outputs*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
